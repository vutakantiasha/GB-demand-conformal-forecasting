[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-demand-conformal-forecasting"
version = "1.0.0"
description = "Leakage-safe Great Britain day-ahead electricity demand forecasting with quantile models and conformal calibration."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Vutakanti Asha Reddy"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "torch>=2.4,<2.16; sys_platform == 'darwin'",
  "torch>=2.4,<3; sys_platform != 'darwin'",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "matplotlib>=3.9,<4",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
  "holidays>=0.60,<1",
  "shap>=0.46,<1",
  "joblib>=1.4,<2",
  "pyarrow>=17,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "bandit[toml]>=1.8,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<5",
  "detect-secrets>=1.5,<2",
  "types-PyYAML>=6.0,<7",
  "types-requests>=2.32,<3",
]

[project.scripts]
gbdf = "gb_demand_forecasting.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --disable-warnings"
testpaths = ["tests"]
markers = ["slow: end-to-end or training-heavy test"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", "data", "artifacts", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S311", "S603"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["notebooks/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "data", "artifacts", "results"]
skips = ["B101", "B311", "B603"]
