project:
  title: Synthetic smoke validation for GB demand conformal pipeline
  random_seed: 2712
paths:
  raw_dir: data/raw_smoke
  interim_dir: data/interim_smoke
  processed_dir: data/processed_smoke
  artifacts_dir: artifacts_smoke
  results_dir: results_smoke
  reports_dir: reports_smoke
source:
  mode: synthetic
  embedded_chunksize: 250000
  years:
  - 2024
  synthetic:
    start_date: '2024-01-01'
    end_date: '2024-08-31'
forecast:
  timezone: Europe/London
  origin_local_time: '12:15'
  target: national_demand_mw
  normal_day_periods: 48
  exclude_dst_transition_days_primary: true
splits:
  training:
  - '2024-01-01'
  - '2024-04-30'
  validation:
  - '2024-05-01'
  - '2024-05-31'
  calibration:
  - '2024-06-01'
  - '2024-06-30'
  test:
  - '2024-07-01'
  - '2024-08-31'
features:
  model_features:
  - settlement_period
  - sp_sin
  - sp_cos
  - dow_sin
  - dow_cos
  - month_sin
  - month_cos
  - is_weekend
  - is_bank_holiday_ew
  - is_bank_holiday_scotland
  - lag_1d_available
  - demand_lag_1d_mw
  - demand_lag_2d_mw
  - demand_lag_7d_mw
  - demand_lag_14d_mw
  - demand_rolling_mean_7d_mw
  - demand_rolling_std_7d_mw
  - prevday_morning_mean_mw
  - prevday_morning_max_mw
  - embedded_wind_forecast_mw
  - embedded_solar_forecast_mw
  shift_features:
  - national_demand_mw
  - demand_lag_7d_mw
models:
  seasonal_naive:
    lag_days: 7
  lightgbm_config: configs/models/lightgbm_smoke.yaml
  tft_config: configs/models/tft_smoke.yaml
conformal:
  config: configs/models/conformal.yaml
evaluation:
  bootstrap_replicates: 100
  bootstrap_seed: 2026
  rolling_window_days: 14
  primary_interval_level: 0.9
  top_error_days: 5
  example_plot_dates: 1
runtime:
  device: cpu
  num_workers: 0
  fail_on_data_quality_error: true
  create_dashboard_assets: false
  run_shap: false
  shap_max_rows: 200
