project:
  title: Reliable Day-Ahead Electricity Demand Forecasting for Great Britain Using
    Conformal Prediction under Temporal Distribution Shift
  random_seed: 2712
paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  artifacts_dir: artifacts
  results_dir: results
  reports_dir: reports
source:
  mode: neso
  base_url: https://api.neso.energy
  timeout_seconds: 60
  retries: 4
  embedded_chunksize: 250000
  years:
  - 2023
  - 2024
  - 2025
  - 2026
  datasets:
    historic_demand: historic-demand-data
    embedded_forecasts: embedded-wind-and-solar-forecasts
    day_ahead_performance: day-ahead-half-hourly-demand-forecast-performance
forecast:
  timezone: Europe/London
  origin_local_time: '12:15'
  target: national_demand_mw
  normal_day_periods: 48
  exclude_dst_transition_days_primary: true
splits:
  training:
  - '2023-01-01'
  - '2024-12-31'
  validation:
  - '2025-01-01'
  - '2025-04-30'
  calibration:
  - '2025-05-01'
  - '2025-12-31'
  test:
  - '2026-01-01'
  - '2026-08-31'
features:
  model_features:
  - settlement_period
  - sp_sin
  - sp_cos
  - dow_sin
  - dow_cos
  - month_sin
  - month_cos
  - is_weekend
  - is_bank_holiday_ew
  - is_bank_holiday_scotland
  - lag_1d_available
  - demand_lag_1d_mw
  - demand_lag_2d_mw
  - demand_lag_7d_mw
  - demand_lag_14d_mw
  - demand_rolling_mean_7d_mw
  - demand_rolling_std_7d_mw
  - prevday_morning_mean_mw
  - prevday_morning_max_mw
  - embedded_wind_forecast_mw
  - embedded_solar_forecast_mw
  shift_features:
  - national_demand_mw
  - demand_lag_7d_mw
  - embedded_wind_forecast_mw
  - embedded_solar_forecast_mw
models:
  seasonal_naive:
    lag_days: 7
  lightgbm_config: configs/models/lightgbm.yaml
  tft_config: configs/models/tft.yaml
conformal:
  config: configs/models/conformal.yaml
evaluation:
  bootstrap_replicates: 1000
  bootstrap_seed: 2026
  rolling_window_days: 30
  primary_interval_level: 0.9
  top_error_days: 20
  example_plot_dates: 3
runtime:
  device: auto
  num_workers: 0
  fail_on_data_quality_error: true
  create_dashboard_assets: true
  run_shap: true
  shap_max_rows: 2000
