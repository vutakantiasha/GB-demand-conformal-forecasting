name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests scripts app
      - name: Ruff
        run: ruff check src tests scripts app
      - name: Pytest
        run: pytest -q --cov=gb_demand_forecasting --cov-report=term-missing --cov-fail-under=60
      - name: Built-in SAST fallback
        run: python scripts/security_audit.py
      - name: Bandit
        run: bandit -r src -c pyproject.toml

  synthetic-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: End-to-end deterministic smoke pipeline
        run: gbdf full-run --config configs/smoke.yaml
      - name: Archive smoke engineering outputs
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-outputs
          path: |
            reports_smoke/
            results_smoke/metrics/
          retention-days: 7
